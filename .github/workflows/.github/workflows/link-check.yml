name: Link and data verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 0" # Monday 00:00 Korea Standard Time
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "data/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate guide data and documentation
        run: python3 scripts/verify_repo.py
      - name: Probe external links
        run: python3 scripts/check_links.py --timeout 20 --parallel 8
